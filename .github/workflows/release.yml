name: إصدار جديد (نسخة + APK)

# ينشئ إصداراً كاملاً بضغطة زر:
#   يرفع رقم النسخة → يبني APK → ينشر Release برابط تحميل مباشر ودائم
#   → ويكتب version.json فتكتشف الأجهزة المثبّتة التحديث وحدها
#
# الاستعمال: تبويب Actions → «إصدار جديد (نسخة + APK)» → Run workflow
#
# رقم النسخة مصدره package.json، ومنه يشتق android/app/build.gradle قيمتَي
# versionName و versionCode تلقائياً.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'نوع الزيادة في رقم النسخة'
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: 'ملاحظات الإصدار (اختياري — تُولَّد من الكوميتات إن تُركت فارغة)'
        type: string
        required: false
      prerelease:
        description: 'إصدار تجريبي (لا يظهر كأحدث إصدار)'
        type: boolean
        default: false
      allow_debug_signing:
        description: 'اسمح بنشر إصدار موقّع بمفتاح debug (للتجربة فقط — لا يمكن تحديثه لاحقاً)'
        type: boolean
        default: false
      upload_to_capgo:
        description: 'رفع حزمة الويب لـ Capgo أيضاً (خطة بديلة — التحديث يعمل من GitHub بدونها)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: تجهيز Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تجهيز Gradle مع التخزين المؤقت
        uses: gradle/actions/setup-gradle@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: رفع رقم النسخة
        id: version
        run: |
          OLD=$(node -p "require('./package.json').version")
          npm version "${{ inputs.bump }}" --no-git-tag-version > /dev/null
          NEW=$(node -p "require('./package.json').version")
          echo "old=$OLD"       >> "$GITHUB_OUTPUT"
          echo "new=$NEW"       >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"      >> "$GITHUB_OUTPUT"
          echo "### الإصدار $OLD ← $NEW" >> "$GITHUB_STEP_SUMMARY"

      - name: نسخ أصول الويب ومزامنة Capacitor
        run: |
          npm run sync:web
          npx cap sync android

      - name: فحص تطابق حاسبَي المواقيت ومنطق التحديث
        run: |
          npm run test:prayer-calc
          npm run test:update-flow
          npm run test:backup

      - name: اختبار الاستقلال عن الإنترنت
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:offline

      - name: تحديد نوع البناء
        id: build
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::لا يوجد مفتاح توقيع — سيصدر APK بنسخة debug"
            echo "type=debug" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      # ــــــــ حاجز يمنع نشر إصدار لا يمكن تحديثه ــــــــ
      # بناء debug يوقّعه Gradle بمفتاح يولّده في ~/.android/debug.keystore،
      # وخوادم GitHub تُنشأ من الصفر كل مرة — فكل بناء يخرج بمفتاح مختلف.
      # وأندرويد يرفض استبدال تطبيق بآخر موقّع بمفتاح مختلف، أي أن كل تحديث
      # سيفرض على المستخدم حذف التطبيق وفقدان بياناته. هذا ليس افتراضاً:
      # v1.2.1 خرجت ببصمة 452473ba… و v1.3.0 ببصمة db3cb8c6… من نفس الكود.
      #
      # لذلك لا يُنشر إصدار موقّع بمفتاح debug إلا بطلب صريح للتجربة.
      - name: منع نشر إصدار لا يمكن تحديثه
        if: steps.build.outputs.type == 'debug' && inputs.allow_debug_signing != true
        run: |
          echo "::error::لا يوجد مفتاح توقيع، وبناء debug يحمل مفتاحاً جديداً في كل مرة."
          echo "::error::نشره يعني أن كل تحديث تالٍ سيفرض حذف التطبيق وفقدان بيانات المستخدم."
          echo "::error::اضبط أسرار التوقيع أولاً (docs/native-shell.md)، أو فعّل allow_debug_signing للتجربة."
          exit 1

      - name: فك تشفير مفتاح التوقيع
        if: steps.build.outputs.type == 'release'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/noor.keystore"
          echo "NOOR_KEYSTORE_PATH=$RUNNER_TEMP/noor.keystore" >> "$GITHUB_ENV"

      - name: بناء الـ APK
        working-directory: android
        env:
          NOOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.build.outputs.task }} --stacktrace

      - name: تجهيز الملف والتحقق من رقم النسخة داخله
        id: apk
        run: |
          TYPE="${{ steps.build.outputs.type }}"
          SOURCE="android/app/build/outputs/apk/$TYPE/app-$TYPE.apk"
          TARGET="noor-${{ steps.version.outputs.new }}.apk"
          cp "$SOURCE" "$TARGET"

          # نتأكد أن الـ APK يحمل فعلاً النسخة الجديدة قبل نشرها
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          BADGING=$("$AAPT" dump badging "$TARGET" 2>/dev/null | head -1 || true)
          echo "$BADGING"
          if ! echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.new }}'"; then
            echo "::error::رقم النسخة داخل الـ APK لا يطابق ${{ steps.version.outputs.new }}"
            exit 1
          fi

          echo "name=$TARGET" >> "$GITHUB_OUTPUT"
          echo "- الملف: \`$TARGET\` ($(du -h "$TARGET" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # ــــــــ قلب نظام التحديث الذاتي ــــــــ
      # version.json هو ما تقرأه الأجهزة المثبَّتة لتعرف أن هناك جديداً. يُكتب
      # هنا لأن روابط الإصدار تصير معلومة الآن (الوسم + أسماء المرفقات)، ويُدفع
      # مع كوميت الإصدار فينشره GitHub Pages تلقائياً.
      - name: تجهيز حزمة الويب وكتابة version.json
        id: manifest
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          # مُصدَّرة لأن سكربت node أدناه يقرؤها من البيئة.
          #
          # ⚠️ لا تسمِّ أياً منها ZIP أو ZIPOPT: برنامج zip يقرأ خياراته
          # الافتراضية من هذين المتغيّرين، فلو صدّرنا ZIP="ملف.zip" ابتلعه zip
          # كاسم للأرشيف وكتبه في المجلد الحالي متجاهلاً المسار الذي نعطيه —
          # بصمت وبرمز خروج 0. لهذا الاسم هنا WEB_ZIP.
          export VERSION="${{ steps.version.outputs.new }}"
          export TAG="${{ steps.version.outputs.tag }}"
          export APK="${{ steps.apk.outputs.name }}"
          export WEB_ZIP="noor-web-$VERSION.zip"
          export BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"

          # حزمة الويب = محتوى www بلا version.json نفسه: الأجهزة تقرأ الملف
          # المنشور على الشبكة، فلا معنى لأن تحمل الحزمة نسخة منه تتقادم.
          ( cd www && zip -qr "$GITHUB_WORKSPACE/$WEB_ZIP" . -x 'version.json' )

          if [ ! -f "$WEB_ZIP" ]; then
            echo "::error::لم تُنشأ حزمة الويب $WEB_ZIP"
            exit 1
          fi

          # إسناد عادي لا export: ‏export يعيد رمز نجاحه هو، فيخفي فشل الأمر
          # داخله عن set -e. بهذا الشكل يفشل البناء فوراً لو فشل أي أمر.
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          ZIP_SHA=$(sha256sum "$WEB_ZIP" | cut -d' ' -f1)
          APK_SIZE=$(stat -c%s "$APK")
          # بصمة المحتوى: يستخدمها web-release.yml لتعرف لو تغيّر الويب بعد هذا الإصدار
          CONTENT_HASH=$(find www -type f -not -name 'version.json' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)

          # بصمة شهادة التوقيع: يقارنها التطبيق بشهادته المثبَّتة. اختلافهما
          # يعني أن أندرويد سيرفض التحديث فوق المثبَّت، فيتحوّل التطبيق إلى
          # مسار «احفظ بياناتك ثم احذف القديمة» بدل تنزيل لن يُثبَّت.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
            | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
          if [ -z "$CERT_SHA" ]; then
            echo "::error::تعذّرت قراءة بصمة شهادة التوقيع من $APK"
            exit 1
          fi
          echo "بصمة شهادة التوقيع: $CERT_SHA"

          # تغيّر الشهادة عن الإصدار السابق حدث جلل: كل جهاز مثبَّت سيضطر لحذف
          # التطبيق. مشروع لمرة واحدة عند الانتقال إلى مفتاح ثابت، وكارثة إن تكرّر.
          PREV_CERT=$(node -p "try{require('./islamic-app/version.json').app.sha256Cert||''}catch(e){''}" 2>/dev/null || true)
          if [ -n "$PREV_CERT" ] && [ "$PREV_CERT" != "$CERT_SHA" ]; then
            echo "::warning::تغيّرت شهادة التوقيع عن الإصدار السابق ($PREV_CERT ← $CERT_SHA)."
            echo "::warning::كل جهاز مثبَّت سيحتاج حذف النسخة القديمة. التطبيق سينبّه المستخدم ويحفظ بياناته أولاً."
            echo "> ⚠️ تغيّرت شهادة التوقيع — الأجهزة المثبّتة ستحتاج حذف النسخة القديمة." >> "$GITHUB_STEP_SUMMARY"
          fi

          # نفس معادلة android/app/build.gradle: 1.2.3 → 10203
          VERSION_CODE=$(node -p "
            const [a,b,c] = process.env.VERSION.split('.').map(Number);
            a * 10000 + b * 100 + c;
          ")

          export APK_SHA ZIP_SHA APK_SIZE VERSION_CODE CERT_SHA CONTENT_HASH
          export NOTES="${RELEASE_NOTES:-تحديث $VERSION}"

          node -e '
            const fs = require("fs");
            const manifest = {
              _comment: "تكتبه الـ CI عند كل إصدار (release.yml) — لا تعدّله يدوياً.",
              generatedAt: new Date().toISOString(),
              app: {
                version: process.env.VERSION,
                versionCode: Number(process.env.VERSION_CODE),
                apkUrl: process.env.BASE + "/" + process.env.APK,
                sizeBytes: Number(process.env.APK_SIZE),
                sha256: process.env.APK_SHA,
                sha256Cert: process.env.CERT_SHA,
                notes: process.env.NOTES,
                mandatory: false,
              },
              web: {
                version: process.env.VERSION,
                url: process.env.BASE + "/" + process.env.WEB_ZIP,
                checksum: process.env.ZIP_SHA,
                contentHash: process.env.CONTENT_HASH,
              },
            };
            fs.writeFileSync("islamic-app/version.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          npm run sync:web
          cat islamic-app/version.json

          echo "zip=$WEB_ZIP" >> "$GITHUB_OUTPUT"
          echo "- حزمة الويب: \`$WEB_ZIP\` ($(du -h "$WEB_ZIP" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: تثبيت النسخة في المستودع ووسمها
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json www islamic-app/version.json android/app/capacitor.build.gradle android/capacitor.settings.gradle
          git commit -m "إصدار ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "إصدار ${{ steps.version.outputs.tag }}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: نشر الإصدار وإرفاق الـ APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            if [ -n "$RELEASE_NOTES" ]; then
              printf '%s\n\n' "$RELEASE_NOTES"
            fi
            echo "### التثبيت"
            echo
            echo "نزّل \`${{ steps.apk.outputs.name }}\` وثبّته على جهاز أندرويد."
            echo
            echo "> الأجهزة التي عليها نور بالفعل ستكتشف هذا الإصدار وحدها وتعرض إشعاراً بالتحديث."
            if [ "${{ steps.build.outputs.type }}" = "debug" ]; then
              echo
              echo "> نسخة debug — للتثبيت المباشر. لإصدار موقّع، اضبط أسرار التوقيع (انظر docs/native-shell.md)."
            fi
          } > "$NOTES_FILE"

          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.apk.outputs.name }}" \
            "${{ steps.manifest.outputs.zip }}" \
            --title "نور ${{ steps.version.outputs.tag }}" \
            --notes-file "$NOTES_FILE" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '--latest' }}

          echo "- الإصدار: $(gh release view "${{ steps.version.outputs.tag }}" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: رفع حزمة الويب لـ Capgo (تحديث لاسلكي للأجهزة المثبّتة)
        if: inputs.upload_to_capgo
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "::notice::لم يُضبط سر CAPGO_TOKEN — تخطّي التحديث اللاسلكي"
            exit 0
          fi
          npx @capgo/cli@latest bundle upload \
            --apikey "$CAPGO_TOKEN" \
            --path www \
            --channel production

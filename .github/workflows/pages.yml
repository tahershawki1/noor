name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/configure-pages@v5

      # يكتب version.json ويختم index.html برقم النسخة، ويضيف ?v=<sha>
      # لملفات CSS/JS حتى يلتقط المتصفح التحديث فور نشره بدل خدمة نسخة مخزّنة.
      - name: ختم نسخة الإصدار
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/build-version.mjs islamic-app

      # يُنشر محتوى islamic-app (المصدر الوحيد لواجهة التطبيق)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./islamic-app

      - id: deployment
        uses: actions/deploy-pages@v4
